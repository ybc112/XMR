name: Verify contracts (BSC Testnet)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'scripts/prepare-verify-inputs.mjs'
      - 'scripts/submit-verify.mjs'
      - '.github/workflows/verify-testnet.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
      BSC_TESTNET_RPC_URL: https://bsc-testnet.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx hardhat compile

      - name: Prepare verify inputs
        run: node scripts/prepare-verify-inputs.mjs

      - name: Verify MockUSDT
        run: node scripts/submit-verify.mjs work/verify-input-MockUSDT.json 0xBCE748bd6A0B93318f2B0DebA2Efc59f5107072C contracts/mock/MockUSDT.sol:MockUSDT v0.8.20+commit.a1b79de6

      - name: Verify XMRToken
        run: node scripts/submit-verify.mjs work/verify-input-XMRToken.json 0x7f8600a20B88bb713E04c689f70d92BFE965828E contracts/XMRToken.sol:XMRToken v0.8.20+commit.a1b79de6

      - name: Verify StakingDApp
        run: node scripts/submit-verify.mjs work/verify-input-StakingDApp.json 0xd8757c0c9646397e9b71f63C1E1e0Ab8963e2ad4 contracts/StakingDApp.sol:StakingDApp v0.8.20+commit.a1b79de6

      - name: Verify MultiSigWallet
        run: node scripts/submit-verify.mjs work/verify-input-MultiSigWallet.json 0x8A85061dc4C48a65b7b10E0EF41b1a315b889018 contracts/MultiSigWallet.sol:MultiSigWallet v0.8.20+commit.a1b79de6
