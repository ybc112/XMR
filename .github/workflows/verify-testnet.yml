name: Verify contracts (BSC Testnet)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'scripts/prepare-verify-inputs.mjs'
      - 'scripts/submit-verify.mjs'
      - '.github/workflows/verify-testnet.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
      BSC_TESTNET_RPC_URL: https://bsc-testnet.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx hardhat compile

      - name: Prepare verify inputs
        run: node scripts/prepare-verify-inputs.mjs

      - name: Verify MockUSDT
        run: node scripts/submit-verify.mjs work/verify-input-MockUSDT.json 0x7BA7b94d0c55A6761bA8bFdE079a934631f656c7 contracts/mock/MockUSDT.sol:MockUSDT v0.8.20+commit.a1b79de6

      - name: Verify XMRToken
        run: node scripts/submit-verify.mjs work/verify-input-XMRToken.json 0x7A4b49cCAaDF69C4FCfd2223F8E3e30dAAb9F123 contracts/XMRToken.sol:XMRToken v0.8.20+commit.a1b79de6

      - name: Verify StakingDApp
        run: node scripts/submit-verify.mjs work/verify-input-StakingDApp.json 0xdb29E9eB1149d33E0979285eacf56572fACA62C9 contracts/StakingDApp.sol:StakingDApp v0.8.20+commit.a1b79de6

      - name: Verify MultiSigWallet
        run: node scripts/submit-verify.mjs work/verify-input-MultiSigWallet.json 0xAEb8B096a717AeF05F169707968623C2c9F97650 contracts/MultiSigWallet.sol:MultiSigWallet v0.8.20+commit.a1b79de6
