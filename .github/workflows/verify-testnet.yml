name: Verify contracts (BSC Testnet)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - '.github/workflows/verify-testnet.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
      BSC_TESTNET_RPC_URL: https://bsc-testnet.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Diagnose bytecode match
        run: |
          npx hardhat compile
          node scripts/verify-diag.js 0xE842ca85D537eA6Ff7359B2DDdAD2cdB39b1F092

      - name: Verify MockUSDT
        run: npx hardhat verify --network bscTestnet 0xE842ca85D537eA6Ff7359B2DDdAD2cdB39b1F092

      - name: Verify XMRToken
        run: npx hardhat verify --network bscTestnet 0x4EC566978354E4E947821050Fc23eD4993d8c753

      - name: Verify StakingDApp
        run: npx hardhat verify --network bscTestnet --constructor-args scripts/verify-args/staking-args.js 0x873a5ae5e840b60a88134aC166A865D7a10FDD35

      - name: Verify MultiSigWallet
        run: npx hardhat verify --network bscTestnet --constructor-args scripts/verify-args/multisig-args.js 0x5651428D3397EE6F7EFDA773e26159403485072D
