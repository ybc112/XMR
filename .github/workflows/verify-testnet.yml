name: Verify contracts (BSC Testnet)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'scripts/prepare-verify-inputs.mjs'
      - 'scripts/submit-verify.mjs'
      - '.github/workflows/verify-testnet.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
      BSC_TESTNET_RPC_URL: https://bsc-testnet.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx hardhat compile

      - name: Prepare verify inputs
        run: node scripts/prepare-verify-inputs.mjs

      - name: Verify MockUSDT
        run: node scripts/submit-verify.mjs work/verify-input-MockUSDT.json 0xc19dbe92987AEe44E7A0442807518532ef0A517a contracts/mock/MockUSDT.sol:MockUSDT v0.8.20+commit.a1b79de6

      - name: Verify XMRToken
        run: node scripts/submit-verify.mjs work/verify-input-XMRToken.json 0x89EBa963BcA8C91502747f4F1528C2A70dB08BeF contracts/XMRToken.sol:XMRToken v0.8.20+commit.a1b79de6

      - name: Verify StakingDApp
        run: node scripts/submit-verify.mjs work/verify-input-StakingDApp.json 0xb1748538616222F30E8031e13E14810B8C26B2c3 contracts/StakingDApp.sol:StakingDApp v0.8.20+commit.a1b79de6

      - name: Verify MultiSigWallet
        run: node scripts/submit-verify.mjs work/verify-input-MultiSigWallet.json 0xd47995d173a2fBCF4426aD83eE2F159C8B583295 contracts/MultiSigWallet.sol:MultiSigWallet v0.8.20+commit.a1b79de6
